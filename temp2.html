<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products</title>

  <link href="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css)" rel="stylesheet">
  <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap)" rel="stylesheet">
  <link rel="stylesheet" href="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css)">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
  background-color: #f8f9fb;
  font-family: 'Poppins', sans-serif;
  color: #333;
}

.section-title {
  font-weight: 700;
  font-size: 1.8rem;
}

.btn-gradient {
  background: linear-gradient(90deg, #6a5cff, #ff4fa3);
  color: #fff;
  border: none;
  border-radius: 30px;
  padding: 10px 20px;
  font-weight: 500;
  transition: transform 0.2s ease, opacity 0.2s ease;
  text-decoration: none;
}
.btn-gradient:hover {
  transform: scale(1.05);
  opacity: 0.9;
  color: #fff;
}

.product-card {
  border: none;
  border-radius: 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.05);
  transition: transform 0.3s ease;
  overflow: hidden;
  background: #fff;
}
.product-card:hover {
  transform: translateY(-5px);
}

.product-card .card-img-top {
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
}

.discount-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  background: linear-gradient(90deg, #6a5cff, #ff4fa3);
  color: #fff;
  font-size: 0.8rem;
  padding: 5px 10px;
  border-radius: 12px;
}

.wishlist-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #fff;
  border: none;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #ff4fa3;
  transition: background 0.2s;
}
.wishlist-btn:hover {
  background: #f1e9ff;
}

.product-category {
  font-size: 0.85rem;
  color: #6a5cff;
  font-weight: 600;
  text-transform: uppercase;
}

.product-name {
  font-size: 1rem;
  font-weight: 600;
}

.star {
  color: #ffc107;
  font-size: 0.85rem;
}

.reviews {
  font-size: 0.85rem;
  color: #777;
  margin-left: 5px;
}

.price {
  display: flex;
  align-items: center;
  gap: 10px;
}

.current-price {
  font-weight: 700;
  color: #333;
}

.old-price {
  text-decoration: line-through;
  color: #888;
  font-size: 0.9rem;
}

.btn-gradient i {
  font-size: 0.9rem;
}

  </style>
</head>

<body>
  <section class="all-products py-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="section-title">All Products</h2>
        <a href="index.html" class="btn-gradient"><i class="fa-solid fa-arrow-left me-2"></i>Back</a>
      </div>

      <div class="row g-4">
        <!-- Repeat 12+ product cards like above -->
        <!-- Example snippet -->
        <div class="col-md-3 col-sm-6">
          <div class="card product-card">
            <div class="position-relative">
              <img src="[via.placeholder.com](https://via.placeholder.com/300x200)" class="card-img-top" alt="Product">
              <span class="badge discount-badge">-18%</span>
              <button class="wishlist-btn"><i class="fa-regular fa-heart"></i></button>
            </div>
            <div class="card-body">
              <span class="product-category">Beauty</span>
              <h5 class="product-name mt-2">Glow Face Cream</h5>
              <div class="rating mb-2">
                <i class="fa-solid fa-star star"></i><i class="fa-solid fa-star star"></i>
                <i class="fa-solid fa-star star"></i><i class="fa-solid fa-star-half-alt star"></i>
                <i class="fa-regular fa-star star"></i>
                <span class="reviews">(66)</span>
              </div>
              <div class="price mb-3">
                <span class="current-price">$35</span>
                <span class="old-price">$42</span>
              </div>
              <button class="btn btn-gradient w-100">Add to Cart <i class="fa-solid fa-cart-shopping ms-2"></i></button>
            </div>
          </div>
        </div>
        <!-- Duplicate this 12+ times with different categories/images -->
      </div>
    </div>
  </section>
</body>
</html>
